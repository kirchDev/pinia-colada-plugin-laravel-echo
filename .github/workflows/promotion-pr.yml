# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Opens and updates the rolling draft promotion PR. The body picks its target by
# asking whether a `stage` branch exists, so this file is identical whether the
# repo runs `dev → main` or `dev → stage → main`.
name: Promotion PR

on:
  push:
    branches:
      - dev
      - stage

permissions:
  contents: read
  pull-requests: write

jobs:
  promotion-pr:
    name: Promotion PR
    uses: kirchDev/workflows/.github/workflows/_promotion-pr.yml@2a38f8dc97e1841e79b2f0e069b386d5b9d435ac # v0.8.1
