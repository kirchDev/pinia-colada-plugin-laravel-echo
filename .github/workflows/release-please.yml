# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# release-please and the npm publish both live in kirchDev/workflows; this file
# carries the triggers and composes the two.
name: Release Please

on:
  push:
    branches:
      - main
      - dev

# The group must NOT be `${{ github.workflow }}-${{ github.ref }}`: inside a
# called workflow `github.workflow` resolves to *this* file's name, so the body
# of `_release-please.yml` — which declares that exact group — would land in the
# same group as the run calling it. GitHub detects the deadlock and cancels the
# job, which then never appears in the run at all: two green jobs, a failed run,
# and no release PR. Any group name the body cannot collide with is fine.
concurrency:
  group: ${{ github.workflow }}-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # dev reaches this workflow for the prerelease job below; release-please
    # itself only ever runs on the release branch.
    if: github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  publish-release:
    name: Publish stable release
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
      # npm Trusted Publishing (OIDC) and the provenance attestation. No
      # NPM_TOKEN exists in this repo.
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0
    with:
      tag-name: ${{ needs.release-please.outputs.tag-name }}

  publish-prerelease:
    name: Publish prerelease
    # Skip the version-bump merges release-please pushes onto main.
    if: >-
      ${{
        github.ref_name == 'dev'
        || (
          github.ref_name == 'main'
          && !startsWith(github.event.head_commit.message, 'chore(main): release')
          && !startsWith(github.event.head_commit.message, 'chore: release')
        )
      }}
    permissions:
      contents: read
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0
    with:
      prerelease: true
